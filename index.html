<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Presensi Pernikahan Pak Saiful Anam</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #f4f6f9; }
    #container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #fafafa; min-height: 250px; border: 1px dashed #ccc; }
    #status { margin-top: 20px; padding: 12px; font-weight: bold; border-radius: 5px; display: none; }
    .sukses { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .proses { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .gagal { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<div id="container">
  <h2>Presensi Pernikahan <br>Pak Saiful Anam</h2>
  <p>Arahkan kamera ke QR Code / Barcode Undangan</p>
  
  <!-- Area Kamera -->
  <div id="reader"></div>
  
  <!-- Notifikasi Status -->
  <div id="status"></div>
</div>

<!-- Menggunakan CDN alternatif cdnjs yang biasanya jauh lebih stabil diakses dari HP -->
<script src="https://cloudflare.com"></script>

<script>
  // PENTING: Ganti teks di bawah ini dengan URL Web App dari Google Apps Script Anda yang asli
  const WEB_APP_URL = "URL_APP_SCRIPT_ANDA_DI_SINI"; 
  
  const statusDiv = document.getElementById('status');
  let isScanning = true;

  function onScanSuccess(decodedText, decodedResult) {
    if (!isScanning) return; 
    isScanning = false; 

    tampilkanStatus("Memproses data: " + decodedText, "proses");

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors", 
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ qrData: decodedText })
    })
    .then(() => {
      tampilkanStatus("Berhasil mencatat kehadiran: " + decodedText, "sukses");
      setTimeout(() => {
        statusDiv.style.display = 'none';
        isScanning = true;
      }, 2500);
    })
    .catch(error => {
      tampilkanStatus("Gagal mengirim ke Excel. Coba lagi.", "gagal");
      isScanning = true;
    });
  }

  function tampilkanStatus(pesan, jenis) {
    statusDiv.style.display = 'block';
    statusDiv.className = jenis;
    statusDiv.innerHTML = pesan;
  }

  // Fungsi inisialisasi scanner yang lebih aman
  function jalankanScanner() {
    // Cek apakah library html5-qrcode berhasil dimuat dari internet
    if (typeof Html5QrcodeScanner === 'undefined') {
      tampilkanStatus("Gagal memuat sistem kamera. Periksa koneksi internet Anda atau coba buka dengan browser lain (Chrome/Safari).", "gagal");
      return;
    }

    try {
      const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { 
          fps: 10, 
          qrbox: { width: 250, height: 250 },
          rememberLastUsedCamera: true
        },
        /* verbose= */ false
      );
      html5QrcodeScanner.render(onScanSuccess, function(error) {
        // Abaikan error real-time scanning (ketika kamera mencari barcode namun belum ketemu)
      });
    } catch (err) {
      tampilkanStatus("Error Scanner: " + err.message, "gagal");
    }
  }

  // Pastikan halaman web dan seluruh skrip luar selesai dimuat baru jalankan kamera
  window.onload = function() {
    setTimeout(jalankanScanner, 500); // Diberi jeda 0.5 detik agar browser siap
  };
</script>

</body>
</html>
