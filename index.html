<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Presensi Pernikahan Pak Saiful Anam</title>
  <!-- Memuat pustaka scanner dari CDN resmi -->
  <script src="https://unpkg.com"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #f4f6f9; }
    #container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; }
    #status { margin-top: 20px; padding: 12px; font-weight: bold; border-radius: 5px; display: none; }
    .sukses { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .proses { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .gagal { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<div id="container">
  <h2>Presensi Pernikahan <br>Pak Saiful Anam</h2>
  <p>Arahkan kamera ke QR Code / Barcode Undangan</p>
  
  <!-- Area Kamera -->
  <div id="reader"></div>
  
  <!-- Notifikasi Status -->
  <div id="status"></div>
</div>

<script>
  // GANTI teks di bawah ini dengan URL Web App dari Google Apps Script Anda
  const WEB_APP_URL = "URL_APP_SCRIPT_ANDA_DI_SINI"; 
  
  const statusDiv = document.getElementById('status');
  let isScanning = true;

  function onScanSuccess(decodedText, decodedResult) {
    if (!isScanning) return; 
    isScanning = false; // Kunci scanner agar tidak mengirim data berkali-kali

    statusDiv.style.display = 'block';
    statusDiv.className = 'proses';
    statusDiv.innerHTML = "Memproses data: " + decodedText;

    // Mengirim data ke Google Sheets via Fetch API
    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors", // Mengabaikan aturan CORS karena Apps Script tidak mendukung CORS bawaan penuh
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ qrData: decodedText })
    })
    .then(() => {
      // Karena menggunakan 'no-cors', kita tidak bisa membaca isi respon JSON secara langsung, 
      // tetapi jika jalurnya sukses (tidak masuk ke catch), asumsi data berhasil terkirim.
      statusDiv.className = 'sukses';
      statusDiv.innerHTML = "Berhasil mencatat kehadiran: " + decodedText;
      
      // Buka kembali scanner setelah 2 detik
      setTimeout(() => {
        statusDiv.style.display = 'none';
        isScanning = true;
      }, 2000);
    })
    .catch(error => {
      statusDiv.className = 'gagal';
      statusDiv.innerHTML = "Gagal mengirim data. Coba lagi.";
      isScanning = true;
    });
  }

  // Menjalankan scanner otomatis menggunakan kamera belakang HP
  const html5QrcodeScanner = new Html5QrcodeScanner(
    "reader", { fps: 10, qrbox: { width: 250, height: 250 } }
  );
  html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
