<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Presensi Pernikahan Pak Saiful Anam</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #f4f6f9; }
    #container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #fafafa; min-height: 250px; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; }
    #status { margin-top: 20px; padding: 12px; font-weight: bold; border-radius: 5px; display: none; }
    .sukses { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .proses { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .gagal { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<div id="container">
  <h2>Presensi Pernikahan <br>Pak Saiful Anam</h2>
  <p>Arahkan kamera ke QR Code / Barcode Undangan</p>
  
  <!-- Area Kamera -->
  <div id="reader">Memuat sistem kamera...</div>
  
  <!-- Notifikasi Status -->
  <div id="status"></div>
</div>

<!-- MEMANGGIL FILE LOKAL REPO GITHUB ANDA SENDIRI -->
<script src="html5-qrcode.min.js"></script>

<script>
  // PENTING: Ganti dengan URL Web App dari Google Apps Script Anda yang asli
  const WEB_APP_URL = "URL_APP_SCRIPT_ANDA_DI_SINI"; 
  
  const statusDiv = document.getElementById('status');
  let isScanning = true;

  function onScanSuccess(decodedText, decodedResult) {
    if (!isScanning) return; 
    isScanning = false; 

    tampilkanStatus("Memproses data: " + decodedText, "proses");

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors", 
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ qrData: decodedText })
    })
    .then(() => {
      tampilkanStatus("Berhasil mencatat kehadiran: " + decodedText, "sukses");
      setTimeout(() => {
        statusDiv.style.display = 'none';
        isScanning = true;
      }, 2500);
    })
    .catch(error => {
      tampilkanStatus("Gagal mengirim ke Excel. Coba lagi.", "gagal");
      isScanning = true;
    });
  }

  function tampilkanStatus(pesan, jenis) {
    statusDiv.style.display = 'block';
    statusDiv.className = jenis;
    statusDiv.innerHTML = pesan;
  }

  function jalankanScanner() {
    if (typeof Html5QrcodeScanner === 'undefined') {
      document.getElementById('reader').innerHTML = "<div style='padding:20px; color:red;'>Gagal memuat file sistem kamera dari repositori Anda. Pastikan nama file 'html5-qrcode.min.js' sudah benar.</div>";
      return;
    }

    try {
      document.getElementById('reader').innerHTML = ""; // Bersihkan teks pemuat
      const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { 
          fps: 10, 
          qrbox: { width: 250, height: 250 }
        },
        /* verbose= */ false
      );
      html5QrcodeScanner.render(onScanSuccess, function(error) {
        // Log pencarian barcode diabaikan agar tidak lambat
      });
    } catch (err) {
      tampilkanStatus("Error Inisialisasi: " + err.message, "gagal");
    }
  }

  // Jalankan deteksi kamera setelah halaman sepenuhnya termuat
  window.onload = function() {
    setTimeout(jalankanScanner, 300);
  };
</script>

</body>
</html>
